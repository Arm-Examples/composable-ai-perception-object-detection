services:
  messaging-service:
    platform: linux/arm64
    image: armlimited/arm-cairn-messaging-service:0.0.1
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  camera-service:
    platform: linux/arm64
    image: armlimited/arm-cairn-camera-service:0.0.1
    user: root
    entrypoint: ["/usr/local/bin/permissions-set-entrypoint.sh"]
    network_mode: host
    group_add: [video]
    cap_add: [SYS_NICE]
    device_cgroup_rules: ["c *:* rw"]
    volumes:
      - pipewire-runtime:/run/pipewire
      - /dev:/dev
      - /run/udev:/run/udev:ro
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:50051"]
      interval: 5s
      timeout: 6s
      start_period: 15s
      retries: 12
    depends_on:
      messaging-service:
        condition: service_healthy

  perception-service:
    platform: linux/arm64
    image: armlimited/arm-cairn-perception-service:0.0.1
    ports: ["127.0.0.1:50053:50053"]
    depends_on:
      messaging-service:
        condition: service_healthy
    volumes:
      - pipewire-runtime:/run/pipewire:ro
      - type: image
        source: perception-example:local
        target: /models
        read_only: true
        image:
          subpath: models

  perception-example:
    platform: linux/arm64
    image: perception-example:local
    build:
      context: .
      args:
        OPK_HF_DETECTION_MODEL: ${OPK_HF_DETECTION_MODEL:-Arm/yolo26n-320-int8-onnx-raspberrypi5}
    network_mode: host
    depends_on:
      camera-service:
        condition: service_healthy
      perception-service:
        condition: service_healthy

volumes:
  pipewire-runtime:

x-topo:
  name: Cairn Perception Object Detection example
  type: application
  description: Runs a Cairn camera-to-inference workflow and prints object detections.
  deployment_success_message: "View live logs: \nssh ${TOPO_TARGET} 'docker logs --follow cairn-perception-object-detection-perception-example-1'"
  parameters:
    OPK_HF_DETECTION_MODEL:
      description: Hugging Face repository for the object-detection model
      required: false
      default: Arm/yolo26n-320-int8-onnx-raspberrypi5
      example: https://huggingface.co/Arm/yolo26n-320-int8-onnx-raspberrypi5
      hints:
        meta.type: huggingface.repo-id
        meta.compatibility: opk
        model.task: object-detection
        model.format: onnx
